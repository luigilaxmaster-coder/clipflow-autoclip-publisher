[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip-publisher"
version = "0.1.0"
description = "Orquestador de producción y publicación automatizada de clips para YouTube Shorts y TikTok con AutoClip"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pytz>=2024.1",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
clipflow = "clipflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clipflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["autoclip-upstream", ".venv", "build", "dist"]

