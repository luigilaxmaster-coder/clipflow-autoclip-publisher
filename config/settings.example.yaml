app:
  data_dir: "C:/Users/PD2/Desktop/clips/data"
  timezone: "America/Santo_Domingo"
  log_level: "INFO"
  max_concurrent_video_jobs: 1
  max_concurrent_uploads: 1
  retain_source_days: 30

analysis:
  max_clips_per_source: 10
  target_clip_duration_sec: [30, 60]
  min_quality_score: 0.6
  min_spacing_between_selected_clips_sec: 8
  transcription: "existing_srt_then_local_or_configured_cloud"
  analysis_provider: "autoclip_saved_settings"

render:
  platforms: ["youtube_shorts", "tiktok"]
  portrait_style: "podcast"
  template: "classic"
  aspect_ratio: "9:16"
  subtitles: true
  brand_outro: false
  validate_mp4: true

publishing:
  provider: "upload_post"
  profile: "main"
  mode: "draft_only"  # draft_only | private_test | manual | auto_approved
  public_autopublish: false
  default_visibility:
    youtube: "private"
    tiktok: "SELF_ONLY"
  schedule_timezone: "America/Santo_Domingo"
  max_publishes_per_day_per_platform: 2
  retry_attempts: 3
  retry_backoff_sec: 5
  require_account_preflight: true
  require_qa_pass: true
  deduplicate_uploads: true

live_peak:
  enabled: false                 # opt-in explícito
  mode: shadow                   # shadow | review | auto
  sample_interval_seconds: 5
  baseline_minutes: 60
  prerecord_seconds: 45
  postrecord_seconds: 30
  peak_enter: 0.72
  peak_exit: 0.45
  peak_enter_consecutive_windows: 2
  peak_exit_seconds: 20
  cooldown_seconds: 90
  max_event_seconds: 240
  min_auto_score: 90
  min_auto_confidence: 0.75
  require_two_signal_families: true
  min_distinct_chatters_for_chat_only_trigger: 10
  max_auto_posts_per_day_per_profile: 2
  minimum_post_gap_minutes: 180
  min_rights_status: confirmed
  publish_publicly: false        # aprobación explícita separada por perfil
  save_raw_chat: false
  ring_buffer_minutes: 30
  max_parallel_capture_jobs: 1
  max_parallel_ai_jobs: 1
