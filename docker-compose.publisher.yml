version: "3.8"

services:
  # Base de datos PostgreSQL para Postiz
  postiz-postgres:
    image: postgres:16-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postiz}
      POSTGRES_USER: ${POSTGRES_USER:-postiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postiz_secure_password_2026}
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postiz} -d ${POSTGRES_DB:-postiz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para colas y caché de Postiz
  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - postiz-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Server para flujos asíncronos y cron de Postiz
  postiz-temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: postiz-temporal
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
    environment:
      DB: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postiz}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postiz_secure_password_2026}
      POSTGRES_SEEDS: postiz-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
      - "8088:8080" # Temporal Web UI

  # Motor de Publicación Postiz (Self-Hosted AGPL-3.0)
  postiz:
    image: ghcr.io/gitroomhq/postiz:latest
    container_name: postiz-app
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    ports:
      - "4007:4007"
    environment:
      MAIN_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTIZ_FRONTEND_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_BACKEND_URL:-http://localhost:4007/api}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postiz}:${POSTGRES_PASSWORD:-postiz_secure_password_2026}@postiz-postgres:5432/${POSTGRES_DB:-postiz}?schema=public
      REDIS_URL: redis://postiz-redis:6379
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-change_this_jwt_secret_in_production_autoclip}
      BACKEND_INTERNAL_URL: http://localhost:3000
      IS_GENERAL: "true"
      DISABLE_TELEMETRY: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz-uploads:/uploads

  # AutoClip Publisher & Web Dashboard
  clipflow:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    container_name: clipflow-publisher
    restart: unless-stopped
    depends_on:
      - postiz
    ports:
      - "8000:8000"
    environment:
      AUTOCLIP_ENV: production
      DATABASE_URL: sqlite:////app/data/clipflow.db
      POSTIZ_API_URL: http://postiz:4007
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-default_secure_secret_clipflow_2026}
      TIMEZONE: America/Santo_Domingo
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./clips_para_seleccion:/app/clips_para_seleccion

volumes:
  postiz-postgres-data:
  postiz-redis-data:
  postiz-uploads:
