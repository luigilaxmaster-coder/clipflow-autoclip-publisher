name: autoclip-publisher

services:
  # Base de datos PostgreSQL para Postiz (solo red interna, sin puertos expuestos al host)
  postiz-postgres:
    image: postgres:16.6-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postiz}
      POSTGRES_USER: ${POSTGRES_USER:-postiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio y debe ser un secreto único}
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks:
      - publisher-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postiz} -d ${POSTGRES_DB:-postiz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para colas y caché de Postiz (solo red interna, con contraseña obligatoria)
  postiz-redis:
    image: redis:7.4-alpine
    container_name: postiz-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}"]
    volumes:
      - postiz-redis-data:/data
    networks:
      - publisher-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Server para flujos asíncronos de Postiz (solo red interna, sin puertos expuestos al host)
  postiz-temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: postiz-temporal
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
    environment:
      DB: postgres
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postiz}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio y debe ser un secreto único}
      POSTGRES_SEEDS: postiz-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    networks:
      - publisher-internal

  # Motor de Publicación Postiz (Self-Hosted AGPL-3.0, versión fija, solo localhost)
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.26.0
    container_name: postiz-app
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4007:4007"
    environment:
      MAIN_URL: ${POSTIZ_MAIN_URL:-http://127.0.0.1:4007}
      FRONTEND_URL: ${POSTIZ_FRONTEND_URL:-http://127.0.0.1:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_BACKEND_URL:-http://127.0.0.1:4007/api}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postiz}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postiz-postgres:5432/${POSTGRES_DB:-postiz}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}@postiz-redis:6379
      JWT_SECRET: ${POSTIZ_JWT_SECRET:?POSTIZ_JWT_SECRET es obligatorio y debe ser un secreto aleatorio}
      BACKEND_INTERNAL_URL: http://localhost:3000
      IS_GENERAL: "true"
      DISABLE_TELEMETRY: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz-uploads:/uploads
    networks:
      - publisher-internal

  # AutoClip Publisher (FastAPI + Worker supervisados, versión fija, solo localhost)
  clipflow:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    container_name: clipflow-publisher
    restart: unless-stopped
    depends_on:
      - postiz
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUTOCLIP_ENV: production
      CLIPFLOW_ALLOW_MOCKS: "false"
      CLIPFLOW_DATABASE_URL: sqlite:////app/data/clipflow.db
      CLIPFLOW_DATA_DIR: /app/data
      POSTIZ_API_URL: http://postiz:4007
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      OWNER_TOKEN: ${OWNER_TOKEN:?OWNER_TOKEN es obligatorio y debe ser un secreto único}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY es obligatorio}
      CLIPFLOW_TIMEZONE: America/Santo_Domingo
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./clips_para_seleccion:/app/clips_para_seleccion
    networks:
      - publisher-internal

networks:
  publisher-internal:
    driver: bridge

volumes:
  postiz-postgres-data:
  postiz-redis-data:
  postiz-uploads:
