<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de Propietario — AutoClip Publisher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-8 shadow-2xl text-center">
    <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/20 text-white text-xl">
      <i class="fa-solid fa-lock"></i>
    </div>
    
    <h2 class="text-lg font-bold text-white mb-1">AUTOCLIP PUBLISHER</h2>
    <p class="text-xs text-slate-400 mb-6">Acceso exclusivo para el propietario de la plataforma.</p>

    <form action="/login" method="post" class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Clave Maestra / Owner Token</label>
        <input type="password" name="token" required placeholder="Introduce tu clave privada..." class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md shadow-indigo-600/30 transition">
        Desbloquear Espacio Personal
      </button>
    </form>

    <div class="mt-6 text-[11px] text-slate-500">
      Cifrado local &middot; Sin servidores externos de autenticación
    </div>
  </div>
</body>
</html>
